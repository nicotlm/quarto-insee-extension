title: insee-clair
author: Romain Puyau
version: 0.1.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    revealjs:
      header-includes: |
        <link rel="icon" type="image/png" sizes="32x32"
          href="_extensions/insee-clair/ressources/revealJs/insee_embleme_couleurs_RVB.svg">

      logo: _extensions/insee-clair/ressources/img/licences/cc/png/by-sa.png #uncomment here to add license logo for instance or comment to hide it
      view-distance: 100 # keep all slides rendered → counter sees them all when rendering title slides
      mobile-view-distance: 100
      embed-resources: true
      df-print: paged
      slide-number: c/t
      progress: true
      controls-layout: bottom-right
      controls-tutorial: true
      controls-back-arrows: faded
      background-transition: fade
      navigation-mode: linear # linear/grid or vertical
      history: true
      transition-speed: slow
      number-sections: true
      number-depth: 2

      link-external-newwindow: true
      # link-external-icon: true
      # footnotes-hover: true
      # reference-location: document #block / section / margin / document
      code-fold: true
      code-summary: "Code"
      code-copy: true
      code-annotations: hover #below / hover / select
      highlight-style: atom-one

      menu: { side: "left", width: "wide", markers: true, transitions: true }

      width: 1920
      height: 1080

      theme: _extensions/insee-clair/ressources/css/Insee_Commun.scss
      css:
        [
          _extensions/insee-clair/ressources/css/insee_clair.css,
          _extensions/insee-clair/ressources/css/default.css,
        ]

      title-slide-attributes:
        data-background-image: _extensions/insee-clair/ressources/revealJs/1_Template-INSEE-Clair_premiere-page.svg
        data-background-size: contain
        data-background-opacity: "1"

      toc: true
      toc-title: Sommaire
      toc-depth: 1
      footer: |
        <a href="https://www.insee.fr/fr/accueil" target="_blank"><img class="footer-logo footer-logo-inseefr" src="_extensions/insee-clair/ressources/img/logos/svg/1_inseeFR_Noir.svg" alt="Insee.fr"></a>
        <a href="https://bsky.app/profile/insee.fr" target="_blank"><img class="footer-logo" src="_extensions/insee-clair/ressources/img/logos/png/logo_bluesky.png" alt="Bluesky"></a>
        <a href="https://www.instagram.com/insee_fr/" target="_blank"><img class="footer-logo" src="_extensions/insee-clair/ressources/img/logos/png/logo_instagram.jpg" alt="Instagram"></a>
        <a href="https://www.linkedin.com/company/insee" target="_blank"><img class="footer-logo" src="_extensions/insee-clair/ressources/img/logos/png/logoLinkedIn_rond.png" alt="LinkedIn"></a>
        <a href="https://x.com/InseeFr" target="_blank"><img class="footer-logo" src="_extensions/insee-clair/ressources/img/logos/png/logo_X.png" alt="X"></a>
        <a href="https://www.youtube.com/channel/UChCCvJTbZEYsCXyfu27eQ6g" target="_blank"><img class="footer-logo" src="_extensions/insee-clair/ressources/img/logos/png/logoYoutube_rond.png" alt="YouTube"></a>
        <a href="https://blog.insee.fr/" target="_blank"><img class="footer-logo" src="_extensions/insee-clair/ressources/img/logos/png/logo_blog.png" alt="Blog"></a>
        <a href="https://www.insee.fr/fr/information/2381941" target="_blank"><img class="footer-logo" src="_extensions/insee-clair/ressources/img/logos/png/flux_rss.png" alt="RSS"></a>
      filters:
        - slide-background.lua
